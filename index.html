<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Bluff</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='68' font-size='55' text-anchor='middle' font-family='sans-serif'>;-)</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: #F7F7F7; min-height: 100vh; color: #3C3C3C; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); padding: 24px; margin-bottom: 16px; }
    .btn { background: #58CC02; color: white; border: none; padding: 14px 24px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; text-transform: uppercase; box-shadow: 0 4px 0 #46A302; position: relative; top: 0; }
    .btn:active { box-shadow: 0 2px 0 #46A302; top: 2px; }
    .btn:disabled { background: #E5E5E5; box-shadow: 0 4px 0 #CECECE; color: #AFAFAF; }
    .btn-secondary { background: white; color: #1CB0F6; border: 2px solid #E5E5E5; box-shadow: 0 4px 0 #E5E5E5; }
    .btn-vote { background: #CE82FF; box-shadow: 0 4px 0 #A560CC; }
    .btn-results { background: #FF9600; box-shadow: 0 4px 0 #CC7800; }
    .btn-small { padding: 12px 20px; font-size: 14px; width: auto; }
    .input { width: 100%; background: white; border: 2px solid #E5E5E5; border-radius: 16px; padding: 14px 16px; font-size: 16px; font-family: inherit; margin-bottom: 12px; }
    .input:focus { outline: none; border-color: #1CB0F6; }
    .textarea { min-height: 100px; resize: vertical; }
    .word-display { font-size: 2.5rem; font-weight: 800; color: #58CC02; text-align: center; margin: 16px 0; text-transform: capitalize; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; border-radius: 12px; border: 2px solid #E5E5E5; background: white; color: #AFAFAF; cursor: pointer; font-weight: 700; }
    .tab.active { background: #DDF4FF; border-color: #1CB0F6; color: #1CB0F6; }
    .def-card { background: white; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-radius: 16px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
    .def-card:active { border-color: #CECECE; }
    .def-card.selected { border-color: #58CC02; border-width: 3px; background: #F0FDF0; }
    .def-card.wrong { border-color: #FF4B4B; border-width: 3px; background: #FFF0F0; }
    .badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    .badge-submit { background: #DDF4FF; color: #1CB0F6; }
    .badge-vote { background: #F3E5FF; color: #CE82FF; }
    .badge-results { background: #FFF3E0; color: #FF9600; }
    .badge-review { background: #FFFBEB; color: #B8860B; }
    .badge-done { background: #F0FDF0; color: #58CC02; }
    .join-banner { display: flex; justify-content: space-between; align-items: center; background: #F0FDF0; border: 2px solid #58CC02; color: #2E7D32; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; font-weight: 700; font-size: 14px; }
    .join-banner-error { background: #FFF0F0; border-color: #FF4B4B; color: #B91C1C; }
    .status-banner { display: block; width: 100%; text-align: center; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 15px; margin-top: 12px; }
    .status-banner.pending { background: #DDF4FF; color: #1CB0F6; }
    .status-banner.done { background: #F0F0F0; color: #8A8A8A; }
    .invite-link-text { display: inline; background: none; border: none; color: #AFAFAF; font-weight: 400; font-size: 14px; font-family: inherit; cursor: pointer; padding: 0; text-align: left; }
    .invite-link-text:hover { color: #1CB0F6; }
    .streak-badge { display: inline-block; background: #FFF3E0; color: #FF9600; padding: 8px 18px; border-radius: 20px; font-weight: 800; font-size: 16px; margin-top: 4px; }
    .round-item.challenge-item { border: 3px solid #58CC02; box-shadow: 0 0 0 3px rgba(88, 204, 2, 0.15); }
    .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; background: #F7F7F7; }
    .lb-row.me { background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .lb-points { color: #FF9600; font-weight: 800; font-size: 18px; }
    .lb-stats { color: #AFAFAF; font-size: 12px; }
    .round-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: white; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-radius: 16px; margin-bottom: 12px; cursor: pointer; }
    .round-item:hover { border-color: #58CC02; }
    .round-word { font-size: 1.25rem; font-weight: 700; text-transform: capitalize; }
    .result-card { background: white; border: 2px solid transparent; box-shadow: 0 1px 4px rgba(0,0,0,0.06); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .result-card.truth { background: #F0FDF0; border-color: #58CC02; border-width: 3px; }
    .result-truth-badge { display: inline-block; background: #58CC02; color: white; padding: 2px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; margin-left: 8px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-bottom: 16px; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon { font-size: 22px; font-weight: 800; color: #58CC02; }
    .logo-text { font-size: 22px; font-weight: 800; color: #58CC02; }
    .username { background: #F7F7F7; padding: 8px 12px; border-radius: 12px; font-weight: 700; font-size: 13px; color: #777; }
    .signout { background: none; border: none; color: #AFAFAF; cursor: pointer; font-weight: 700; font-size: 13px; margin-left: 12px; }
    .back-btn { background: none; border: none; color: #3C3C3C; cursor: pointer; margin-bottom: 16px; font-weight: 700; }
    .step { display: flex; gap: 12px; color: #777; font-size: 14px; margin-bottom: 12px; }
    .step-num { background: #58CC02; color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
    .invite-code { font-family: monospace; background: #F7F7F7; padding: 4px 10px; border-radius: 8px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
    .truth-notice { background: #F0FDF0; border: 2px solid #58CC02; border-radius: 12px; padding: 12px 16px; margin-top: 12px; display: flex; align-items: center; gap: 8px; }
    .truth-notice.wrong-notice { background: #FFF0F0; border-color: #FF4B4B; }
    .real-def-box { background: #FFFBEB; border: 2px dashed #FFD93D; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .real-def-label { font-size: 12px; font-weight: 700; color: #B8860B; text-transform: uppercase; margin-bottom: 8px; }
    .review-btn { background: #DDF4FF; color: #1CB0F6; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 700; cursor: pointer; margin-right: 8px; font-size: 13px; }
    .center { text-align: center; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .text-muted { color: #AFAFAF; }
    .text-small { font-size: 14px; }
    .flex { display: flex; }
    .gap-2 { gap: 8px; }
    .flex-1 { flex: 1; }
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-icon { font-size: 64px; margin-bottom: 16px; }
    .loading { text-align: center; padding: 60px 20px; font-weight: 700; color: #AFAFAF; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.39.0';
    import { html, render, useState, useEffect } from 'https://esm.sh/htm/preact/standalone';

    // ============================================
    // CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'https://izbrtektldrqrkhscdup.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6YnJ0ZWt0bGRycXJraHNjZHVwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzUyNDksImV4cCI6MjEwMTM1MTI0OX0.ImNYKFVI7qGD9b0J3MwGtzZF9UoWwLAisopFPH3qc8g';
    // ============================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================
    // MAIN APP
    // ============================================
    function App() {
      const [user, setUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [loading, setLoading] = useState(true);
      const [view, setView] = useState('groups');
      const [activeGroup, setActiveGroup] = useState(null);
      const [activeRound, setActiveRound] = useState(null);
      const [pendingJoinCode, setPendingJoinCode] = useState(() => {
        const params = new URLSearchParams(window.location.search);
        return (params.get('join') || '').trim();
      });

      useEffect(() => {
        checkUser();
        const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
          setUser(session?.user ?? null);
          if (session?.user) loadProfile(session.user.id);
          else setProfile(null);
        });
        return () => subscription.unsubscribe();
      }, []);

      const checkUser = async () => {
        const { data: { user } } = await supabase.auth.getUser();
        setUser(user);
        if (user) await loadProfile(user.id);
        setLoading(false);
      };

      const loadProfile = async (userId) => {
        const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
        setProfile(data);
      };

      const signOut = async () => {
        await supabase.auth.signOut();
        setView('groups');
        setActiveGroup(null);
        setActiveRound(null);
      };

      if (loading) return html`<div class="container"><div class="loading">Loading...</div></div>`;
      if (!user) return html`<${Auth} pendingJoinCode=${pendingJoinCode} />`;

      return html`
        <div class="container">
          <header class="header">
            <div class="logo">
              <span class="logo-icon">;-)</span>
              <span class="logo-text">Vocab Bluff</span>
            </div>
            <div style="display: flex; align-items: center;">
              <button class="review-btn" onClick=${() => setView('review')}>🧠 Practice</button>
              <span class="username">${profile?.username}</span>
              <button class="signout" onClick=${signOut}>Sign out</button>
            </div>
          </header>

          ${view === 'round' && activeRound && activeRound.round_type === 'review' && html`
            <button class="back-btn" onClick=${() => setView('group')}>← Back to ${activeGroup?.name}</button>
            <${WeeklyReview} round=${activeRound} group=${activeGroup} userId=${user.id} onBack=${() => setView('group')} />
          `}

          ${view === 'round' && activeRound && activeRound.round_type !== 'review' && html`
            <button class="back-btn" onClick=${() => setView('group')}>← Back to ${activeGroup?.name}</button>
            <${GameRound} round=${activeRound} userId=${user.id} onBack=${() => setView('group')} onUpdate=${(r) => setActiveRound(r)} />
          `}

          ${view === 'group' && activeGroup && html`
            <button class="back-btn" onClick=${() => setView('groups')}>← All Groups</button>
            <${GroupDetail} group=${activeGroup} userId=${user.id} onSelectRound=${(r) => { setActiveRound(r); setView('round'); }} />
          `}

          ${view === 'groups' && html`
            <${GroupList} userId=${user.id} onSelectGroup=${(g) => { setActiveGroup(g); setView('group'); }} initialJoinCode=${pendingJoinCode} onConsumeJoinCode=${() => setPendingJoinCode('')} />
          `}

          ${view === 'review' && html`
            <button class="back-btn" onClick=${() => setView('groups')}>← All Groups</button>
            <p class="text-muted text-small mb-3">Optional practice across every word you've played. This doesn't affect any group's streak — that's the "Weekly Review" inside each group.</p>
            <${ReviewTest} userId=${user.id} />
          `}
        </div>
      `;
    }

    // ============================================
    // AUTH
    // ============================================
    function Auth({ pendingJoinCode }) {
      const [mode, setMode] = useState(pendingJoinCode ? 'signup' : 'signin');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [username, setUsername] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [confirmationSent, setConfirmationSent] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true);
        setError(null);

        if (mode === 'signup') {
          // If email confirmation is required, the confirmation link sends the
          // person back to this exact URL — including the invite code — so
          // they still get auto-joined once they land back here signed in.
          const redirectTo = pendingJoinCode
            ? `${window.location.origin}${window.location.pathname}?join=${pendingJoinCode}`
            : `${window.location.origin}${window.location.pathname}`;
          const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: redirectTo } });
          if (error) {
            setError(error.message);
          } else if (data.session) {
            // Email confirmation is off — user is signed in immediately.
            // onAuthStateChange in App() picks up the session automatically.
          } else {
            // Email confirmation is required — they'll come right back here via redirectTo.
            setConfirmationSent(true);
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setError(error.message);
        }
        setLoading(false);
      };

      // Show only confirmation message after signup (fallback path)
      if (confirmationSent) {
        return html`
          <div class="container" style="padding-top: 60px;">
            <div class="card center">
              <div style="font-size: 72px; margin-bottom: 16px;">📬</div>
              <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 12px;">Check your email!</h2>
              <p style="color: #666; line-height: 1.6;">We sent a confirmation link to <strong>${email}</strong></p>
              <p style="color: #666; line-height: 1.6; margin-top: 8px;">Click the link in the email to activate your account.${pendingJoinCode ? " You'll be automatically added to the group you were invited to." : ''}</p>
              <button class="btn btn-secondary mt-4" onClick=${() => { setConfirmationSent(false); setMode('signin'); }}>← Back to Sign In</button>
            </div>
          </div>
        `;
      }

      return html`
        <div class="container" style="padding-top: 40px;">
          <div class="card">
            <div class="center mb-4">
              
              <h1 style="font-size: 28px; font-weight: 800; color: #58CC02;">Vocab Bluff</h1>
              <p class="text-muted">Learn SAT words by fooling your friends!</p>
            </div>
            ${pendingJoinCode && html`
              <div class="join-banner mb-4">
                <span>🎉 You've been invited to a group! Sign up or sign in to join automatically.</span>
              </div>
            `}
            <div class="tabs">
              <button class="tab ${mode === 'signin' ? 'active' : ''}" onClick=${() => setMode('signin')}>Sign In</button>
              <button class="tab ${mode === 'signup' ? 'active' : ''}" onClick=${() => setMode('signup')}>Sign Up</button>
            </div>
            <form onSubmit=${handleSubmit}>
              ${mode === 'signup' && html`<input class="input" type="text" placeholder="Username" value=${username} onInput=${(e) => setUsername(e.target.value)} required />`}
              <input class="input" type="email" placeholder="Email" value=${email} onInput=${(e) => setEmail(e.target.value)} required />
              <input class="input" type="password" placeholder="Password" value=${password} onInput=${(e) => setPassword(e.target.value)} required minLength="6" />
              ${error && html`<p style="color: #FF4B4B; margin-bottom: 12px;">${error}</p>`}
              <button class="btn" type="submit" disabled=${loading}>${loading ? 'Loading...' : mode === 'signin' ? 'Sign In' : 'Create Account'}</button>
            </form>
            <div style="margin-top: 24px; padding-top: 20px; border-top: 2px solid #E5E5E5;">
              <h4 style="color: #AFAFAF; font-size: 12px; text-transform: uppercase; margin-bottom: 16px;">How It Works</h4>
              <div class="step"><span class="step-num">1</span><span>Join a group — every day, your group gets a new word automatically</span></div>
              <div class="step"><span class="step-num">2</span><span>Everyone writes a fake definition, then votes on which is real</span></div>
              <div class="step"><span class="step-num">3</span><span>Finish as a group before the day ends to keep your streak alive 🔥</span></div>
              <div class="step"><span class="step-num">4</span><span>Every 7th day is a cumulative Weekly Review instead of a new word</span></div>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================
    // GROUP LIST
    // ============================================
    function GroupList({ userId, onSelectGroup, initialJoinCode, onConsumeJoinCode }) {
      const [groups, setGroups] = useState([]);
      const [todayStatus, setTodayStatus] = useState({}); // group_id -> { type, done }
      const [streaks, setStreaks] = useState({}); // group_id -> { current, longest }
      const [loading, setLoading] = useState(true);
      const [showCreate, setShowCreate] = useState(false);
      const [showJoin, setShowJoin] = useState(false);
      const [newName, setNewName] = useState('');
      const [joinCode, setJoinCode] = useState('');
      const [error, setError] = useState(null);
      const [copiedId, setCopiedId] = useState(null);

      const [joining, setJoining] = useState(!!initialJoinCode);
      const [joinBanner, setJoinBanner] = useState(null); // { type: 'success'|'error', message }

      useEffect(() => {
        if (initialJoinCode) {
          autoJoinFromLink(initialJoinCode);
        } else {
          loadGroups();
        }
      }, []);

      const clearJoinParam = () => {
        if (window.history?.replaceState) {
          const url = new URL(window.location.href);
          url.searchParams.delete('join');
          window.history.replaceState({}, '', url);
        }
      };

      // Looks up a group by invite code and joins the current user if not
      // already a member. Shared by the automatic (link) and manual (form) flows.
      const attemptJoin = async (rawCode) => {
        const code = (rawCode || '').trim().toLowerCase();
        if (!code) return { error: 'Enter an invite code.' };
        const { data: group } = await supabase.from('groups').select().eq('invite_code', code).single();
        if (!group) return { error: 'Invite code not found.' };
        const { data: existing } = await supabase.from('group_members').select().eq('group_id', group.id).eq('user_id', userId).single();
        if (!existing) {
          await supabase.from('group_members').insert({ group_id: group.id, user_id: userId });
          await supabase.from('scores').insert({ group_id: group.id, user_id: userId });
        }
        return { group, alreadyMember: !!existing };
      };

      // Someone opened an invite link: join them automatically, no form needed.
      const autoJoinFromLink = async (code) => {
        setJoining(true);
        const result = await attemptJoin(code);
        onConsumeJoinCode && onConsumeJoinCode();
        clearJoinParam();
        if (result.error) {
          setJoinBanner({ type: 'error', message: `That invite link didn't work (${result.error}). You can try entering the code manually below.` });
          setJoinCode(code);
          setShowJoin(true);
        } else {
          setJoinBanner({
            type: 'success',
            message: result.alreadyMember ? `You're already in "${result.group.name}"!` : `🎉 You joined "${result.group.name}"!`
          });
        }
        setJoining(false);
        await loadGroups();
      };

      const todayStr = () => new Date().toISOString().slice(0, 10);

      const loadGroups = async () => {
        setLoading(true);
        const { data } = await supabase.from('group_members').select('groups(*)').eq('user_id', userId);
        const gs = data?.map(d => d.groups).filter(Boolean) || [];
        setGroups(gs);
        setLoading(false);
        loadTodayStatus(gs);
      };

      // For each group, make sure today's challenge exists, then figure out
      // whether *this* user still has something to do today (plus the streak).
      const loadTodayStatus = async (gs) => {
        const results = await Promise.all(gs.map(async (group) => {
          const [{ data: round }, { data: progress }] = await Promise.all([
            supabase.rpc('ensure_daily_challenge', { p_group_id: group.id }),
            supabase.from('group_progress').select('current_streak, longest_streak').eq('group_id', group.id).maybeSingle()
          ]);
          const streakInfo = { current: progress?.current_streak || 0, longest: progress?.longest_streak || 0 };

          if (!round) return { id: group.id, status: null, streak: streakInfo };

          if (round.round_type === 'review') {
            const { data: mine } = await supabase.from('review_completions').select('id').eq('round_id', round.id).eq('user_id', userId).maybeSingle();
            return { id: group.id, status: { type: 'review', done: !!mine }, streak: streakInfo };
          }

          // word round
          if (round.phase === 'results') return { id: group.id, status: { type: 'word', done: true }, streak: streakInfo };
          if (round.phase === 'voting') {
            const { data: mine } = await supabase.from('votes').select('id').eq('round_id', round.id).eq('voter_id', userId).maybeSingle();
            return { id: group.id, status: { type: 'word', done: !!mine }, streak: streakInfo };
          }
          const { data: mine } = await supabase.from('submissions').select('id').eq('round_id', round.id).eq('user_id', userId).maybeSingle();
          return { id: group.id, status: { type: 'word', done: !!mine }, streak: streakInfo };
        }));
        setTodayStatus(Object.fromEntries(results.map(r => [r.id, r.status])));
        setStreaks(Object.fromEntries(results.map(r => [r.id, r.streak])));
      };

      const createGroup = async (e) => {
        e.preventDefault();
        setError(null);
        const { data: group, error: err } = await supabase.from('groups').insert({ name: newName.trim(), created_by: userId }).select().single();
        if (err) { setError(err.message); return; }
        await supabase.from('group_members').insert({ group_id: group.id, user_id: userId });
        await supabase.from('scores').insert({ group_id: group.id, user_id: userId });
        setNewName(''); setShowCreate(false); loadGroups();
      };

      const joinGroup = async (e) => {
        e.preventDefault();
        setError(null);
        const result = await attemptJoin(joinCode);
        if (result.error) { setError(result.error); return; }
        setJoinCode(''); setShowJoin(false);
        setJoinBanner({
          type: 'success',
          message: result.alreadyMember ? `You're already in "${result.group.name}"!` : `🎉 You joined "${result.group.name}"!`
        });
        loadGroups();
      };

      const copyInvite = async (e, group) => {
        e.stopPropagation();
        const link = `${window.location.origin}${window.location.pathname}?join=${group.invite_code}`;
        const text = `You're invited to my Vocab Bluff group "${group.name}"! Tap this invite link to join: ${link}`;
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (err2) { /* ignore */ }
          document.body.removeChild(ta);
        }
        setCopiedId(group.id);
        setTimeout(() => setCopiedId(id => id === group.id ? null : id), 2000);
      };

      if (joining) return html`<div class="loading">Joining your group...</div>`;
      if (loading) return html`<div class="loading">Loading groups...</div>`;

      return html`
        <div>
          <div class="center mb-4">
            <h2 style="font-size: 24px; font-weight: 800;">Your Groups</h2>
            <p class="text-muted">Play Vocab Bluff with friends</p>
          </div>
          ${joinBanner && html`
            <div class="join-banner ${joinBanner.type === 'error' ? 'join-banner-error' : ''}">
              <span>${joinBanner.message}</span>
              <button onClick=${() => setJoinBanner(null)} style="background: none; border: none; cursor: pointer; font-weight: 700; opacity: 0.6;">✕</button>
            </div>
          `}
          <div class="flex gap-2 mb-4">
            <button class="btn btn-small flex-1" onClick=${() => { setShowCreate(true); setShowJoin(false); }}><span style="color: white;">+</span> Create</button>
            <button class="btn btn-secondary btn-small flex-1" onClick=${() => { setShowJoin(true); setShowCreate(false); }}>🔗 Join</button>
          </div>
          ${showCreate && html`
            <form class="card" onSubmit=${createGroup}>
              <h3 class="mb-3" style="font-weight: 700;">Create a New Group</h3>
              <input class="input" placeholder="Group name" value=${newName} onInput=${(e) => setNewName(e.target.value)} />
              ${error && html`<p style="color: #FF4B4B;">${error}</p>`}
              <div class="flex gap-2">
                <button class="btn btn-small flex-1" type="submit">Create</button>
                <button class="btn btn-secondary btn-small" type="button" onClick=${() => setShowCreate(false)}>Cancel</button>
              </div>
            </form>
          `}
          ${showJoin && html`
            <form class="card" onSubmit=${joinGroup}>
              <h3 class="mb-3" style="font-weight: 700;">Join a Group</h3>
              <input class="input" placeholder="Enter code" value=${joinCode} onInput=${(e) => setJoinCode(e.target.value)} style="font-family: monospace; text-align: center; font-size: 24px;" maxLength="6" />
              ${error && html`<p style="color: #FF4B4B;">${error}</p>`}
              <div class="flex gap-2">
                <button class="btn btn-small flex-1" type="submit">Join</button>
                <button class="btn btn-secondary btn-small" type="button" onClick=${() => setShowJoin(false)}>Cancel</button>
              </div>
            </form>
          `}
          ${groups.length === 0 ? html`
            <div class="card empty-state">
              
              <div style="font-size: 20px; font-weight: 700;">No groups yet!</div>
              <div class="text-muted">Create or join a group to play.</div>
            </div>
          ` : groups.map(group => {
            const isOwner = group.created_by === userId;
            const status = todayStatus[group.id];
            const streak = streaks[group.id];

            const leaveGroup = async (e) => {
              e.stopPropagation();
              if (!confirm('Are you sure you want to leave this group?')) return;
              await supabase.from('scores').delete().eq('group_id', group.id).eq('user_id', userId);
              await supabase.from('group_members').delete().eq('group_id', group.id).eq('user_id', userId);
              loadGroups();
            };
            
            const deleteGroup = async (e) => {
              e.stopPropagation();
              if (!confirm('Are you sure you want to DELETE this group? This cannot be undone!')) return;
              await supabase.from('groups').delete().eq('id', group.id);
              loadGroups();
            };
            
            return html`
              <div class="round-item" style="position: relative; flex-direction: column; align-items: stretch;">
                <div style="display: flex; align-items: center;">
                  <div style="cursor: pointer; flex: 1;" onClick=${() => onSelectGroup(group)}>
                    <div class="round-word" style="display: flex; align-items: center; gap: 8px;">
                      <span>${group.name}</span>
                      <span style="font-size: 14px; font-weight: 800; color: #FF9600; text-transform: none;">🔥 ${streak ? streak.current : 0}</span>
                    </div>
                    <div class="text-small text-muted" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
                      <span>Invite code: <span class="invite-code">${group.invite_code}</span></span>
                      <button class="invite-link-text" onClick=${(e) => copyInvite(e, group)}>
                        ${copiedId === group.id ? '✅ Copied!' : '🔗 Copy invite link'}
                      </button>
                    </div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <button 
                      onClick=${leaveGroup} 
                      title="Leave group"
                      style="background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center;"
                    ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
                    ${isOwner && html`
                      <button 
                        onClick=${deleteGroup} 
                        title="Delete group"
                        style="background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center;"
                      ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    `}
                    <span style="font-size: 24px; cursor: pointer; margin-left: 4px;" onClick=${() => onSelectGroup(group)}>→</span>
                  </div>
                </div>
                <div style="cursor: pointer;" onClick=${() => onSelectGroup(group)}>
                  ${!status ? html`<span class="status-banner pending">Loading...</span>` :
                    status.done
                      ? html`<span class="status-banner done">✅ ${status.type === 'review' ? 'Review done today' : 'Done for today'}</span>`
                      : html`<span class="status-banner pending">${status.type === 'review' ? '📝 Weekly review due' : '🎯 Word challenge waiting'}</span>`
                  }
                </div>
              </div>
            `;
          })}
        </div>
      `;
    }

    // ============================================
    // GROUP DETAIL
    // ============================================
    function GroupDetail({ group, userId, onSelectRound }) {
      const [rounds, setRounds] = useState([]);
      const [scores, setScores] = useState([]);
      const [members, setMembers] = useState([]);
      const [progress, setProgress] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [copiedInvite, setCopiedInvite] = useState(false);

      useEffect(() => { loadData(); }, [group.id]);

      const todayStr = () => new Date().toISOString().slice(0, 10);

      const copyInvite = async () => {
        const link = `${window.location.origin}${window.location.pathname}?join=${group.invite_code}`;
        const text = `You're invited to my Vocab Bluff group "${group.name}"! Tap this invite link to join: ${link}`;
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); } catch (err2) { /* ignore */ }
          document.body.removeChild(ta);
        }
        setCopiedInvite(true);
        setTimeout(() => setCopiedInvite(false), 2000);
      };

      const loadData = async () => {
        setLoading(true);
        setError(null);
        // Idempotent: makes sure today's word (or weekly review) exists for this group.
        const { error: rpcErr } = await supabase.rpc('ensure_daily_challenge', { p_group_id: group.id });
        if (rpcErr) setError(rpcErr.message);

        const [r, s, m, p] = await Promise.all([
          supabase.from('rounds').select('*, words(*), submissions(*), votes(*), review_completions(*)').eq('group_id', group.id).order('round_date', { ascending: false }).limit(20),
          supabase.from('scores').select('*, profiles(*)').eq('group_id', group.id).order('total_points', { ascending: false }),
          supabase.from('group_members').select('*, profiles(*)').eq('group_id', group.id),
          supabase.from('group_progress').select('*').eq('group_id', group.id).single()
        ]);
        setRounds(r.data || []); setScores(s.data || []); setMembers(m.data || []); setProgress(p.data || null);
        setLoading(false);
      };

      const getRoundBadge = (round) => {
        if (round.round_type === 'review') {
          const completions = round.review_completions || [];
          const mine = completions.find(c => c.user_id === userId);
          if (members.length > 0 && completions.length >= members.length) return { l: 'Completed', c: 'badge-results' };
          if (mine) return { l: `Waiting (${completions.length}/${members.length})`, c: 'badge-review' };
          return { l: 'Take Test', c: 'badge-review' };
        }
        if (round.phase === 'voting') return { l: 'Vote', c: 'badge-vote' };
        if (round.phase === 'results') {
          const votes = round.votes || [];
          const submissions = round.submissions || [];
          const mySubmission = submissions.find(s => s.user_id === userId);
          const correctPoint = votes.some(v => v.voter_id === userId && v.submission_id === null) ? 1 : 0;
          const foolCount = mySubmission ? votes.filter(v => v.submission_id === mySubmission.id).length : 0;
          const points = correctPoint + foolCount * 2;
          return { l: `Results · +${points} pts`, c: 'badge-results' };
        }
        const subs = round.submissions || [];
        const mySubmitted = subs.some(s => s.user_id === userId);
        if (mySubmitted) return { l: `Waiting (${subs.length}/${members.length})`, c: 'badge-submit' };
        return { l: 'Create Definition', c: 'badge-submit' };
      };

      if (loading) return html`<div class="loading">Loading...</div>`;

      const todayRound = rounds.find(r => r.round_date === todayStr());
      const pastRounds = rounds.filter(r => r.round_date !== todayStr());
      const streak = progress?.current_streak || 0;
      const best = progress?.longest_streak || 0;

      return html`
        <div>
          <div class="card center">
            <h2 style="font-size: 28px; font-weight: 800; margin-bottom: 4px;">${group.name}</h2>
            <p class="text-muted mb-3">${members.length} players • Code: <span class="invite-code">${group.invite_code}</span></p>
            <div class="streak-badge">🔥 ${streak} day streak${best > streak ? html` <span style="font-weight: 600; font-size: 13px; opacity: 0.75;">(best ${best})</span>` : ''}</div>
            ${members.length < 2 && html`
              <p class="text-muted text-small mt-3">
                Invite at least one friend — bluffing needs more than one player! <button class="invite-link-text" onClick=${copyInvite}>${copiedInvite ? '✅ Invite link copied!' : '🔗 Copy invite link'}</button>
              </p>
            `}
          </div>

          <h3 style="font-weight: 700; margin: 20px 0 12px;">Today's Challenge</h3>
          ${error && html`<p style="color: #FF4B4B; font-size: 13px; margin-bottom: 8px;">${error}</p>`}
          ${todayRound ? html`
            <div class="round-item challenge-item" onClick=${() => onSelectRound(todayRound)}>
              <div>
                <span class="round-word">${todayRound.round_type === 'review' ? '📝 Weekly Review' : todayRound.words?.word}</span>
                <div class="text-small text-muted">${todayRound.round_type === 'review' ? 'Cumulative test of your last 7 words' : "Today's bluff round"}</div>
              </div>
              <span class="badge ${getRoundBadge(todayRound).c}">${getRoundBadge(todayRound).l}</span>
            </div>
          ` : html`<div class="card center"><p class="text-muted">Setting up today's challenge...</p></div>`}

          <h3 style="font-weight: 700; margin: 24px 0 12px;">All Words</h3>
          ${pastRounds.length === 0 ? html`<div class="card center"><p class="text-muted">No history yet.</p></div>` : pastRounds.map(round => {
            const badge = getRoundBadge(round);
            return html`
              <div class="round-item" onClick=${() => onSelectRound(round)}>
                <span class="round-word">${round.round_type === 'review' ? '📝 Weekly Review' : round.words?.word}</span>
                <span class="badge ${badge.c}">${badge.l}</span>
              </div>
            `;
          })}
          <h3 style="font-weight: 700; margin: 24px 0 4px;">Leaderboard</h3>
          <p class="text-muted text-small mb-3">+1 point for choosing the real definition, +2 points if your fake definition is selected</p>
          ${scores.length === 0 ? html`<div class="card center"><p class="text-muted">Play to earn points!</p></div>` : scores.map((s, i) => html`
            <div class="lb-row ${s.user_id === userId ? 'me' : ''}">
              <div style="display: flex; align-items: center;">
                <span style="font-size: 24px; margin-right: 12px;">${s.total_points > 0 ? (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '#' + (i+1)) : '•'}</span>
                <span style="font-weight: 700;">@${s.profiles?.username}</span>
              </div>
              <div style="text-align: right;">
                <div class="lb-points">${s.total_points} pts</div>
                <div class="lb-stats">${s.fools} <span style="color: #58CC02; font-weight: 800;">;-)</span> • ${s.correct_guesses} ✓</div>
              </div>
            </div>
          `)}
        </div>
      `;
    }

    // ============================================
    // GAME ROUND
    // ============================================
    function GameRound({ round, userId, onBack, onUpdate }) {
      const [word, setWord] = useState(null);
      const [submissions, setSubmissions] = useState([]);
      const [mySubmission, setMySubmission] = useState(null);
      const [myVote, setMyVote] = useState(null);
      const [allVotes, setAllVotes] = useState([]);
      const [definition, setDefinition] = useState('');
      const [selected, setSelected] = useState(null);
      const [loading, setLoading] = useState(true);
      const [submitting, setSubmitting] = useState(false);
      const [shuffledOptions, setShuffledOptions] = useState([]);

      useEffect(() => { loadRound(); }, [round.id, round.phase]);

      const loadRound = async () => {
        const [w, s, v, av] = await Promise.all([
          supabase.from('words').select('*').eq('id', round.word_id).single(),
          supabase.from('submissions').select('*, profiles(*)').eq('round_id', round.id),
          supabase.from('votes').select('*').eq('round_id', round.id).eq('voter_id', userId).single(),
          supabase.from('votes').select('*, profiles:voter_id(username)').eq('round_id', round.id)
        ]);
        setWord(w.data);
        const subs = s.data || [];
        setSubmissions(subs);
        setMySubmission(subs.find(x => x.user_id === userId));
        setMyVote(v.data);
        setAllVotes(av.data || []);
        
        // Create shuffled options: all submissions + the real definition
        if (w.data) {
          const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
          const fakeOptions = subs.map(sub => ({ 
            id: sub.id, 
            definition: sub.definition, 
            isReal: false, 
            oderId: sub.user_id
          }));
          const realOption = { 
            id: 'real', 
            definition: capitalize(w.data.definition), 
            isReal: true, 
            oderId: null
          };
          const allOptions = [...fakeOptions, realOption].sort(() => Math.random() - 0.5);
          setShuffledOptions(allOptions);
        }
        
        setLoading(false);
      };

      const submitDef = async () => {
        setSubmitting(true);
        await supabase.from('submissions').insert({ round_id: round.id, user_id: userId, definition: definition.trim(), is_truth: false });
        setDefinition('');
        await checkSubmittingAdvance();
        setSubmitting(false);
      };

      // Auto-advance to voting once every current member has submitted.
      const checkSubmittingAdvance = async () => {
        const [subsRes, gmRes] = await Promise.all([
          supabase.from('submissions').select('id').eq('round_id', round.id),
          supabase.from('group_members').select('id').eq('group_id', round.group_id)
        ]);
        const subCount = (subsRes.data || []).length;
        const memCount = (gmRes.data || []).length;
        if (memCount >= 2 && subCount >= memCount) {
          await supabase.from('rounds').update({ phase: 'voting' }).eq('id', round.id);
          onUpdate({ ...round, phase: 'voting' });
          return;
        }
        await loadRound();
      };

      const submitVote = async () => {
        if (!selected) return;
        setSubmitting(true);
        // Store the selected id (could be 'real' or a submission id)
        await supabase.from('votes').insert({ round_id: round.id, voter_id: userId, submission_id: selected === 'real' ? null : selected });
        await checkVotingAdvance();
        setSubmitting(false);
      };

      // Auto-advance to results once every current member has voted.
      const checkVotingAdvance = async () => {
        const [votesRes, gmRes] = await Promise.all([
          supabase.from('votes').select('id').eq('round_id', round.id),
          supabase.from('group_members').select('id').eq('group_id', round.group_id)
        ]);
        const voteCount = (votesRes.data || []).length;
        const memCount = (gmRes.data || []).length;
        if (memCount >= 2 && voteCount >= memCount) {
          await finalizeResults();
          return;
        }
        await loadRound();
      };

      const finalizeResults = async () => {
        const { data: votes } = await supabase.from('votes').select('*').eq('round_id', round.id);

        // Award points for fooling others (votes on fake submissions)
        for (const sub of submissions) {
          const fools = votes?.filter(v => v.submission_id === sub.id).length || 0;
          if (fools > 0) {
            const { data: sc } = await supabase.from('scores').select('*').eq('group_id', round.group_id).eq('user_id', sub.user_id).single();
            if (sc) await supabase.from('scores').update({ total_points: sc.total_points + fools * 2, fools: sc.fools + fools }).eq('id', sc.id);
          }
        }

        // Award points for correct guesses (votes where submission_id is null = voted for real)
        const correctVoters = votes?.filter(v => v.submission_id === null) || [];
        for (const v of correctVoters) {
          const { data: sc } = await supabase.from('scores').select('*').eq('group_id', round.group_id).eq('user_id', v.voter_id).single();
          if (sc) await supabase.from('scores').update({ total_points: sc.total_points + 1, correct_guesses: sc.correct_guesses + 1 }).eq('id', sc.id);
        }

        await supabase.from('rounds').update({ phase: 'results' }).eq('id', round.id);
        // Group has now fully completed today's word challenge — advance the streak.
        await supabase.rpc('complete_challenge', { p_group_id: round.group_id, p_round_id: round.id });
        onUpdate({ ...round, phase: 'results' });
      };

      if (loading) return html`<div class="loading">Loading...</div>`;

      if (round.phase === 'submitting') {
        return html`
          <div>
            <div class="card center">
              <p class="text-muted mb-2" style="font-weight: 600;">Today's word:</p>
              <div class="word-display">${word?.word}</div>
            </div>
            ${mySubmission ? html`
              <div class="card">
                <p class="text-muted mb-2" style="font-weight: 600;">Your fake definition:</p>
                <p>${mySubmission.definition}</p>
                <p class="text-muted text-small mt-4">⏳ Waiting for everyone to submit... (${submissions.length} in)</p>
                <p class="text-muted text-small">Voting starts automatically once the whole group has submitted.</p>
              </div>
            ` : html`
              <div class="card">
                <p class="mb-3" style="font-weight: 600;">🎭 Make up a fake definition:</p>
                <p class="text-muted text-small mb-3">Write something that sounds real but isn't! Try to fool your friends.</p>
                <textarea class="input textarea" value=${definition} onInput=${(e) => setDefinition(e.target.value)} placeholder="Write a convincing fake definition..."></textarea>
                <button class="btn" onClick=${submitDef} disabled=${submitting || !definition.trim()}>${submitting ? 'Submitting...' : 'Submit'}</button>
              </div>
            `}
          </div>
        `;
      }

      if (round.phase === 'voting') {
        return html`
          <div>
            <div class="card center">
              <p class="text-muted mb-2" style="font-weight: 600;">Which is the REAL definition?</p>
              <div class="word-display">${word?.word}</div>
              <p class="text-muted text-small mt-2">One of these is real. The rest are fakes!</p>
            </div>
            ${myVote ? html`
              <div class="card center">
                <p style="font-weight: 600;">✅ You voted!</p>
                <p class="text-muted">Waiting for the rest of the group to vote...</p>
                <p class="text-muted text-small mt-2">Results appear automatically once everyone's in.</p>
              </div>
            ` : html`
              <div>
                ${shuffledOptions.map(opt => html`
                  <div 
                    class="def-card ${selected === opt.id ? 'selected' : ''} ${opt.oderId === userId ? 'yours' : ''}" 
                    onClick=${() => opt.oderId !== userId && setSelected(opt.id)}
                    style="${opt.oderId === userId ? 'opacity: 0.6; cursor: not-allowed; border-style: dashed;' : ''}"
                  >
                    ${opt.definition}
                    ${opt.oderId === userId ? html`<p style="font-size: 11px; color: #AFAFAF; margin-top: 8px; font-style: italic;">— Your submission (can't vote for your own)</p>` : ''}
                  </div>
                `)}
                <button class="btn btn-vote mt-3" onClick=${submitVote} disabled=${submitting || !selected}>${submitting ? 'Voting...' : 'Submit Vote'}</button>
              </div>
            `}
          </div>
        `;
      }

      // Results phase
      const realVotes = allVotes.filter(v => v.submission_id === null);
      const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
      
      return html`
        <div>
          <div class="card center" style="background: #F0FDF0; border-color: #58CC02;">
            <p class="text-muted mb-2" style="font-weight: 600;">✓ The real definition:</p>
            <div class="word-display">${word?.word}</div>
            <p style="font-size: 18px; line-height: 1.5; margin-top: 12px;">${capitalize(word?.definition)}</p>
            ${word?.example_sentence && html`<p class="text-muted text-small mt-3" style="font-style: italic;">"${word.example_sentence}"</p>`}
            ${realVotes.length > 0 && html`
              <p style="margin-top: 12px; font-size: 14px; color: #58CC02; font-weight: 600;">
                ✓ ${realVotes.length} correct vote${realVotes.length !== 1 ? 's' : ''}
              </p>
            `}
          </div>
          
          ${submissions.length > 0 && html`
            <h3 style="font-weight: 700; margin: 24px 0 12px;">🎭 The fakes:</h3>
            ${submissions.map(sub => {
              const voteCount = allVotes.filter(v => v.submission_id === sub.id).length;
              return html`
                <div class="result-card">
                  <p>${sub.definition}</p>
                  <p style="font-size: 12px; color: #AFAFAF; margin-top: 8px;">— @${sub.profiles?.username}</p>
                  ${voteCount > 0 && html`
                    <p style="font-size: 13px; color: #FF9600; margin-top: 6px; font-weight: 600;">
                      🎭 Fooled ${voteCount} player${voteCount !== 1 ? 's' : ''} (+${voteCount * 2} pts)
                    </p>
                  `}
                </div>
              `;
            })}
          `}
          
          <button class="btn btn-secondary mt-4" onClick=${onBack}>← Back to Group</button>
        </div>
      `;
    }

    // ============================================
    // WEEKLY REVIEW (mandatory, one per group, every 7 words)
    // ============================================
    function WeeklyReview({ round, group, userId, onBack }) {
      const [loading, setLoading] = useState(true);
      const [questions, setQuestions] = useState([]);
      const [members, setMembers] = useState([]);
      const [completions, setCompletions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [finished, setFinished] = useState(false);
      const [saving, setSaving] = useState(false);

      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
      const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

      useEffect(() => { load(); }, [round.id]);

      const load = async () => {
        setLoading(true);
        const ids = round.review_round_ids || [];
        const [roundsRes, compRes, memRes] = await Promise.all([
          ids.length ? supabase.from('rounds').select('*, words(*), submissions(*)').in('id', ids) : Promise.resolve({ data: [] }),
          supabase.from('review_completions').select('*').eq('round_id', round.id),
          supabase.from('group_members').select('id').eq('group_id', group.id)
        ]);

        const built = (roundsRes.data || [])
          .filter(r => r.words)
          .map(r => {
            const options = shuffle([
              { key: 'real', text: capitalize(r.words.definition), correct: true },
              ...(r.submissions || []).map(s => ({ key: s.id, text: s.definition, correct: false }))
            ]);
            return { id: r.id, word: r.words.word, options };
          });

        setQuestions(shuffle(built));
        setCompletions(compRes.data || []);
        setMembers(memRes.data || []);
        setCurrentIndex(0);
        setSelected(null);
        setScore(0);
        setFinished(false);
        setLoading(false);
      };

      const myCompletion = completions.find(c => c.user_id === userId);

      const selectOption = (opt) => {
        if (selected) return;
        setSelected(opt);
        if (opt.correct) setScore(sc => sc + 1);
      };

      const nextQuestion = async () => {
        if (currentIndex + 1 < questions.length) {
          setSelected(null);
          setCurrentIndex(i => i + 1);
          return;
        }
        // Last question answered — record this member's completion.
        setSaving(true);
        await supabase.from('review_completions').insert({ round_id: round.id, user_id: userId, score, total: questions.length });
        const { data: comps } = await supabase.from('review_completions').select('*').eq('round_id', round.id);
        setCompletions(comps || []);
        if (members.length > 0 && (comps || []).length >= members.length) {
          // Whole group has now finished the weekly review — advance the streak.
          await supabase.rpc('complete_challenge', { p_group_id: group.id, p_round_id: round.id });
        }
        setSaving(false);
        setFinished(true);
      };

      if (loading) return html`<div class="loading">Loading weekly review...</div>`;

      if (questions.length === 0) {
        return html`
          <div class="card empty-state">
            <div class="empty-icon">📝</div>
            <div style="font-size: 20px; font-weight: 700;">Nothing to review yet</div>
            <div class="text-muted">Play a few word rounds first.</div>
            <button class="btn btn-secondary mt-4" onClick=${onBack}>← Back to Group</button>
          </div>
        `;
      }

      if (myCompletion && !finished) {
        return html`
          <div class="card center">
            <div style="font-size: 56px; margin-bottom: 12px;">✅</div>
            <h2 style="font-size: 22px; font-weight: 800; margin-bottom: 8px;">You already finished this week's review!</h2>
            <p class="text-muted mb-2">You scored ${myCompletion.score} / ${myCompletion.total}</p>
            <p class="text-muted text-small">${completions.length} of ${members.length} group members done</p>
            <button class="btn btn-secondary mt-4" onClick=${onBack}>← Back to Group</button>
          </div>
        `;
      }

      if (finished) {
        const groupDone = members.length > 0 && completions.length >= members.length;
        return html`
          <div class="card center">
            <div style="font-size: 64px; margin-bottom: 16px;">${groupDone ? '🎉' : '⏳'}</div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Review Complete!</h2>
            <p class="text-muted mb-2">You scored ${score} out of ${questions.length}</p>
            <p class="text-muted text-small mb-4">${groupDone ? "Everyone in the group finished — streak continues! 🔥" : `${completions.length} of ${members.length} group members done. The streak continues once everyone finishes.`}</p>
            <button class="btn btn-secondary" onClick=${onBack} disabled=${saving}>← Back to Group</button>
          </div>
        `;
      }

      const q = questions[currentIndex];

      return html`
        <div>
          <div class="card center">
            <p class="text-muted mb-2" style="font-weight: 600;">Weekly Review · Question ${currentIndex + 1} of ${questions.length}</p>
            <div class="word-display">${q.word}</div>
            <p class="text-muted text-small">Which definition is REAL?</p>
          </div>
          <div>
            ${q.options.map(opt => {
              let cls = 'def-card';
              let statusText = '';
              let statusColor = '';
              if (selected) {
                if (opt.correct) { cls += ' selected'; statusText = '✅ Correct!'; statusColor = '#58CC02'; }
                else if (selected.key === opt.key) { cls += ' wrong'; statusText = '❌ Not quite'; statusColor = '#FF4B4B'; }
              }
              return html`
                <div class="${cls}" onClick=${() => selectOption(opt)}>
                  ${opt.text}
                  ${statusText && html`<p style="font-size: 13px; font-weight: 700; margin-top: 8px; color: ${statusColor};">${statusText}</p>`}
                </div>
              `;
            })}
          </div>
          ${selected && html`
            <button class="btn mt-3" onClick=${nextQuestion} disabled=${saving}>${saving ? 'Saving...' : (currentIndex + 1 < questions.length ? 'Next Word →' : 'Finish Review →')}</button>
          `}
        </div>
      `;
    }

    // ============================================
    // PRACTICE MODE (optional, cumulative, cross-group)
    // ============================================
    function ReviewTest({ userId }) {
      const [loading, setLoading] = useState(true);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [answered, setAnswered] = useState(0);

      useEffect(() => { loadQuestions(); }, []);

      const shuffle = (arr) => [...arr].sort(() => Math.random() - 0.5);
      const capitalize = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

      const loadQuestions = async () => {
        setLoading(true);

        // Every group this user is a member of
        const { data: gm } = await supabase.from('group_members').select('group_id').eq('user_id', userId);
        const groupIds = (gm || []).map(g => g.group_id);
        if (groupIds.length === 0) { setQuestions([]); setLoading(false); return; }

        // Every completed round across all of those groups
        const { data: roundsData } = await supabase
          .from('rounds')
          .select('*, words(*), submissions(*)')
          .in('group_id', groupIds)
          .eq('phase', 'results');

        const built = (roundsData || [])
          .filter(r => r.words && r.submissions && r.submissions.length > 0)
          .map(r => {
            const options = shuffle([
              { key: 'real', text: capitalize(r.words.definition), correct: true },
              ...r.submissions.map(s => ({ key: s.id, text: s.definition, correct: false }))
            ]);
            return { id: r.id, word: r.words.word, options };
          });

        setQuestions(shuffle(built));
        setCurrentIndex(0);
        setSelected(null);
        setScore(0);
        setAnswered(0);
        setLoading(false);
      };

      const selectOption = (opt) => {
        if (selected) return;
        setSelected(opt);
        setAnswered(a => a + 1);
        if (opt.correct) setScore(sc => sc + 1);
      };

      const nextQuestion = () => { setSelected(null); setCurrentIndex(i => i + 1); };

      if (loading) return html`<div class="loading">Loading review test...</div>`;

      if (questions.length === 0) {
        return html`
          <div class="card empty-state">
            <div class="empty-icon">📝</div>
            <div style="font-size: 20px; font-weight: 700;">No words to review yet!</div>
            <div class="text-muted">Finish some bluff rounds and they'll show up here.</div>
          </div>
        `;
      }

      if (currentIndex >= questions.length) {
        return html`
          <div class="card center">
            <div style="font-size: 64px; margin-bottom: 16px;">🎉</div>
            <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 8px;">Review Complete!</h2>
            <p class="text-muted mb-4">You scored ${score} out of ${questions.length}</p>
            <button class="btn" onClick=${loadQuestions}>🔄 Take Again</button>
          </div>
        `;
      }

      const q = questions[currentIndex];

      return html`
        <div>
          <div class="card center">
            <p class="text-muted mb-2" style="font-weight: 600;">Question ${currentIndex + 1} of ${questions.length}</p>
            <div class="word-display">${q.word}</div>
            <p class="text-muted text-small">Which definition is REAL?</p>
          </div>
          <div>
            ${q.options.map(opt => {
              let cls = 'def-card';
              let statusText = '';
              let statusColor = '';
              if (selected) {
                if (opt.correct) { cls += ' selected'; statusText = '✅ Correct!'; statusColor = '#58CC02'; }
                else if (selected.key === opt.key) { cls += ' wrong'; statusText = '❌ Not quite'; statusColor = '#FF4B4B'; }
              }
              return html`
                <div class="${cls}" onClick=${() => selectOption(opt)}>
                  ${opt.text}
                  ${statusText && html`<p style="font-size: 13px; font-weight: 700; margin-top: 8px; color: ${statusColor};">${statusText}</p>`}
                </div>
              `;
            })}
          </div>
          ${selected && html`
            <button class="btn mt-3" onClick=${nextQuestion}>${currentIndex + 1 < questions.length ? 'Next Word →' : 'See Score →'}</button>
          `}
          <p class="text-muted text-small center mt-3">Score so far: ${score}/${answered}</p>
        </div>
      `;
    }

    // ============================================
    // RENDER
    // ============================================
    render(html`<${App} />`, document.getElementById('root'));
  </script>
</body>
</html>
